name: Daily CV Paper Watch

on:
  schedule:
    # GitHub cron is UTC. This runs at 07:30 Asia/Hong_Kong every day.
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cv-paper-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect papers
        env:
          TZ: Asia/Hong_Kong
          PAPER_BOT_USER_AGENT: "cv-paper-watch/1.0 (+https://github.com/${{ github.repository }})"
        run: >
          python scripts/collect_cv_papers.py
          --db papers.db
          --reports-dir reports
          --sources arxiv,cvf,openreview
          --max-per-source 80
          --openreview-limit-per-term 8
          --max-cvf-venues 8
          --max-cvf-detail-pages 90
          --min-score 12
          --timezone Asia/Hong_Kong

      - name: Commit database and report
        run: |
          git add papers.db reports
          if git diff --cached --quiet; then
            echo "No paper database/report changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update daily CV paper report"
          git push
